---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_deploy_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Extract application archive
  ansible.builtin.unarchive:
    src: "{{ app_deploy_archive }}"
    dest: "{{ app_deploy_path }}"
    owner: root
    group: root

- name: Create application environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_deploy_path }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Build and start application stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_deploy_path }}"
    state: present
    build: always
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 180

- name: Check application homepage
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_http_port }}/"
    method: GET
    status_code: 200
    return_content: false
  register: app_homepage
  retries: 10
  delay: 3
  until: app_homepage.status == 200

- name: Check static CSS
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_http_port }}/static/css/styles.css"
    method: GET
    status_code: 200
    return_content: false

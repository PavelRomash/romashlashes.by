---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_deploy_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Extract application archive
  ansible.builtin.unarchive:
    src: "{{ app_deploy_archive }}"
    dest: "{{ app_deploy_path }}"
    owner: root
    group: root

- name: Configure application nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ app_deploy_path }}/nginx/default.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate nginx container

- name: Create application environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_deploy_path }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Create ACME challenge webroot
  ansible.builtin.file:
    path: "{{ app_deploy_path }}/certbot/www"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Build and start application stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_deploy_path }}"
    state: present
    build: always
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 180


- name: Check HTTP to HTTPS redirect
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_deploy_http_port }}/"
    method: GET
    status_code: 301
    follow_redirects: none
  register: app_deploy_http_redirect
  retries: 10
  delay: 3
  until: app_deploy_http_redirect.status == 301

- name: Check HTTPS application homepage
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ app_https_port }}/"
    method: GET
    headers:
      Host: "{{ app_server_name }}"
    status_code: 200
    validate_certs: false
  register: app_deploy_https_homepage
  retries: 10
  delay: 3
  until: app_deploy_https_homepage.status == 200

- name: Check HTTPS static CSS
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ app_https_port }}/static/css/styles.css"
    method: GET
    headers:
      Host: "{{ app_server_name }}"
    status_code: 200
    validate_certs: false

---
- name: Validate ACME operation
  ansible.builtin.assert:
    that:
      - app_acme_operation in
        ['bootstrap', 'validate-staging', 'issue', 'validate-renewal']
    fail_msg: >-
      app_acme_operation must be one of:
      bootstrap, validate-staging, issue, validate-renewal.

- name: Validate ACME domain configuration
  ansible.builtin.assert:
    that:
      - app_acme_domains | length > 0
      - app_server_name in app_acme_domains
    fail_msg: ACME domains must include the canonical application server name.

- name: Install Certbot
  ansible.builtin.apt:
    name: "{{ app_acme_package }}"
    state: present
    update_cache: true

- name: Create ACME challenge webroot
  ansible.builtin.file:
    path: "{{ app_acme_webroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create application certificate directory
  ansible.builtin.file:
    path: "{{ app_acme_nginx_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Certbot deploy hook directory
  ansible.builtin.file:
    path: "{{ app_acme_deploy_hook_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Certbot deploy hook
  ansible.builtin.template:
    src: deploy-hook.sh.j2
    dest: "{{ app_acme_deploy_hook_path }}"
    owner: root
    group: root
    mode: "0750"

- name: Enable Certbot renewal timer
  ansible.builtin.systemd_service:
    name: certbot.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Check current Let's Encrypt certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ app_acme_cert_name }}/fullchain.pem"
  register: app_acme_certificate

- name: Validate ACME account configuration
  ansible.builtin.assert:
    that:
      - app_acme_email | length > 0
    fail_msg: >-
      app_acme_email must be configured for staging validation
      or production certificate issuance.
  when: app_acme_operation in ['validate-staging', 'issue']

- name: Check running nginx Compose service
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - ps
      - --status
      - running
      - -q
      - "{{ app_acme_nginx_service }}"
    chdir: "{{ app_acme_compose_project_dir }}"
  register: app_acme_nginx_service_state
  changed_when: false
  failed_when: app_acme_nginx_service_state.stdout | trim | length == 0
  when: app_acme_operation != 'bootstrap'

- name: Validate certificate issuance against Let's Encrypt staging
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --webroot
      - --webroot-path
      - "{{ app_acme_webroot }}"
      - --cert-name
      - "{{ app_acme_cert_name }}"
      - --domains
      - "{{ app_acme_domains | join(',') }}"
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ app_acme_email }}"
      - --dry-run
  changed_when: false
  when: app_acme_operation == 'validate-staging'

- name: Ensure Let's Encrypt production certificate matches desired domains
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --webroot
      - --webroot-path
      - "{{ app_acme_webroot }}"
      - --cert-name
      - "{{ app_acme_cert_name }}"
      - --domains
      - "{{ app_acme_domains | join(',') }}"
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ app_acme_email }}"
      - --keep-until-expiring
      - --renew-with-new-domains
  changed_when: true
  when: app_acme_operation == 'issue'

- name: Refresh Let's Encrypt certificate state
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ app_acme_cert_name }}/fullchain.pem"
  register: app_acme_certificate_after_operation
  when: app_acme_operation in ['issue', 'validate-renewal']

- name: Require production certificate for requested operation
  ansible.builtin.assert:
    that:
      - app_acme_certificate_after_operation.stat.exists
    fail_msg: >-
      Production certificate does not exist for
      {{ app_acme_cert_name }}.
  when: app_acme_operation in ['issue', 'validate-renewal']

- name: Ensure current production certificate is deployed to nginx
  ansible.builtin.command:
    argv:
      - "{{ app_acme_deploy_hook_path }}"
  environment:
    RENEWED_LINEAGE: "/etc/letsencrypt/live/{{ app_acme_cert_name }}"
    RENEWED_DOMAINS: "{{ app_acme_domains | join(' ') }}"
  changed_when: false
  when: app_acme_operation == 'issue'

- name: Validate automatic certificate renewal and deploy hook
  ansible.builtin.command:
    argv:
      - certbot
      - renew
      - --cert-name
      - "{{ app_acme_cert_name }}"
      - --dry-run
      - --run-deploy-hooks
  changed_when: false
  when: app_acme_operation == 'validate-renewal'

stages:
  - test
  - deploy

variables:
  DJANGO_SECRET_KEY: "ci-only-secret-key-not-for-production"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost"

  POSTGRES_DB: "romashlashes_ci"
  POSTGRES_USER: "romashlashes_ci"
  POSTGRES_PASSWORD: "romashlashes_ci_password"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  DJANGO_SECURE_SSL_REDIRECT: "False"
  DJANGO_SESSION_COOKIE_SECURE: "False"
  DJANGO_CSRF_COOKIE_SECURE: "False"
  DJANGO_SECURE_HSTS_SECONDS: "0"
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
  DJANGO_SECURE_HSTS_PRELOAD: "False"

django-check:
  stage: test
  image: python:3.14-slim

  tags:
    - docker
    - dev

  services:
    - name: postgres:17
      alias: postgres

  before_script:
    - cd app
    - python --version
    - pip install --no-cache-dir -r requirements.txt

  script:
    - python manage.py check
    - python manage.py migrate --noinput
    - python manage.py makemigrations --check --dry-run
    - python manage.py test

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - app/**/*
        - ansible/ansible.cfg
        - ansible/inventory/hosts.yml
        - ansible/inventory/group_vars/dev/**/*
        - ansible/playbooks/deploy-dev.yml
        - ansible/roles/app_deploy/**/*
        - .gitlab-ci.yml

terraform-check:
  stage: test
  image:
    name: registry.int.romashlashes.by/romashlashes/romashlashes.by/terraform-ci:1.0.0
    entrypoint: [""]

  tags:
    - docker
    - dev

  before_script:
    - cd terraform/proxmox
    - terraform version

  script:
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/**/*
        - ci/terraform/**/*
        - .gitlab-ci.yml

ansible-check:
  stage: test
  image: python:3.14-slim

  tags:
    - docker
    - dev

  before_script:
    - pip install --no-cache-dir ansible ansible-lint
    - ansible-galaxy collection install -r "$CI_PROJECT_DIR/ansible/requirements.yml"
    - export ANSIBLE_CONFIG="$CI_PROJECT_DIR/ansible/ansible.cfg"
    - export ANSIBLE_ROLES_PATH="$CI_PROJECT_DIR/ansible/roles"
    - cd "$CI_PROJECT_DIR/ansible"
    - ansible --version

  script:
    - ansible-lint
    - |
      for playbook in playbooks/*.yml; do
        echo "Syntax check: $playbook"
        ansible-playbook \
          -i inventory/hosts.yml \
          "$playbook" \
          --syntax-check \
          --vault-password-file "$ANSIBLE_VAULT_PASSWORD"
      done

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/**/*
        - .gitlab-ci.yml

deploy-dev:
  stage: deploy
  image: python:3.14-slim

  tags:
    - docker
    - dev

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends openssh-client git curl
    - pip install --no-cache-dir ansible

    - mkdir -p ~/.ssh
    - tr -d '\r' < "$ANSIBLE_SSH_PRIVATE_KEY" > ~/.ssh/romashlashes-ci
    - printf '\n' >> ~/.ssh/romashlashes-ci
    - chmod 600 ~/.ssh/romashlashes-ci
    - ssh-keygen -y -f ~/.ssh/romashlashes-ci > /dev/null
    - ssh-keyscan -H 192.168.0.185 >> ~/.ssh/known_hosts
    - export ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/romashlashes-ci

    - export ANSIBLE_CONFIG="$CI_PROJECT_DIR/ansible/ansible.cfg"
    - export ANSIBLE_ROLES_PATH="$CI_PROJECT_DIR/ansible/roles"

  script:
    - cd "$CI_PROJECT_DIR/ansible"
    - >
      ansible-playbook
      -i inventory/hosts.yml
      playbooks/deploy-dev.yml
      --vault-password-file "$ANSIBLE_VAULT_PASSWORD"

    - >
      curl
      --fail
      --silent
      --show-error
      --insecure
      --resolve dev.romashlashes.test:443:192.168.0.185
      https://dev.romashlashes.test/
      --output /dev/null

    - >
      curl
      --fail
      --silent
      --show-error
      --insecure
      --resolve dev.romashlashes.test:443:192.168.0.185
      https://dev.romashlashes.test/static/css/styles.css
      --output /dev/null

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - app/**/*
        - ansible/ansible.cfg
        - ansible/inventory/hosts.yml
        - ansible/inventory/group_vars/dev/**/*
        - ansible/playbooks/deploy-dev.yml
        - ansible/roles/app_deploy/**/*
        - .gitlab-ci.yml
      when: manual
